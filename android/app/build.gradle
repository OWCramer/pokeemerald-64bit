// Thin packaging project: the game (libmain.so) and libSDL3.so are built
// outside Gradle by `make android` and staged into src/main/jniLibs/<abi>.
// Gradle only compiles the SDL Java glue and packages those prebuilt libraries,
// so there is no externalNativeBuild here.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Version is derived from the release tag, not hardcoded. CI passes the tag
// explicitly via -PversionName=<x.y.z> (-PversionCode optional); a local build
// falls back to `git describe`. versionCode must be a monotonically increasing
// integer, so map x.y.z -> x*10000 + y*100 + z (e.g. 1.2.2 -> 10202).
def resolveVersionName = {
    if (project.hasProperty('versionName')) return project.property('versionName').toString()
    try {
        def p = ['git', 'describe', '--tags', '--always'].execute(null, rootProject.projectDir)
        p.waitFor()
        if (p.exitValue() == 0) return p.text.trim().replaceFirst(/^v/, '')
    } catch (ignored) {}
    return '0.0.0'
}
def resolveVersionCode = { String name ->
    if (project.hasProperty('versionCode')) return project.property('versionCode').toString().toInteger()
    def m = (name =~ /(\d+)\.(\d+)\.(\d+)/)
    // Clamp to >= 1: Android rejects versionCode 0, and untagged builds resolve
    // to the 0.0.0 fallback, which would otherwise map straight to 0.
    if (m.find()) return Math.max(1, m.group(1).toInteger() * 10000 + m.group(2).toInteger() * 100 + m.group(3).toInteger())
    return 1
}
def appVersionName = resolveVersionName()
def appVersionCode = resolveVersionCode(appVersionName)

android {
    namespace = "com.owcramer.pokeemerald"
    compileSdk 35
    defaultConfig {
        applicationId "com.owcramer.pokeemerald"
        // Android 8.0. The floor is set by what the app's own UI uses rather
        // than by SDL (which would still run on 21): android:appCategory, the
        // Material 3 dialog styling, and the document picker's EXTRA_INITIAL_URI
        // all arrive in 26, and supporting older releases would mean carrying a
        // second, worse code path for a share of devices that no longer exists.
        minSdkVersion 26
        targetSdkVersion 35
        versionCode appVersionCode
        versionName appVersionName
        ndk {
            abiFilters 'x86_64', 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // libmain.so has text relocations (-z notext); keep it uncompressed and let
    // it load, and don't let the linter block the build over the prebuilt libs.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    lint {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// The app's own code is Kotlin; the org.libsdl.app glue stays as upstream ships
// it so it can be updated by dropping in a new SDL release.
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    // Material 3 dialogs, and dynamic colour on Android 12+.
    implementation 'com.google.android.material:material:1.12.0'
}
