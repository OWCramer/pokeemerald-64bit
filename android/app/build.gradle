// Thin packaging project: the game (libmain.so) and libSDL3.so are built
// outside Gradle by `make android` and staged into src/main/jniLibs/<abi>.
// Gradle only compiles the SDL Java glue and packages those prebuilt libraries,
// so there is no externalNativeBuild here.
plugins {
    id 'com.android.application'
}

// Version is derived from the release tag, not hardcoded. CI passes the tag
// explicitly via -PversionName=<x.y.z> (-PversionCode optional); a local build
// falls back to `git describe`. versionCode must be a monotonically increasing
// integer, so map x.y.z -> x*10000 + y*100 + z (e.g. 1.2.2 -> 10202).
def resolveVersionName = {
    if (project.hasProperty('versionName')) return project.property('versionName').toString()
    try {
        def p = ['git', 'describe', '--tags', '--always'].execute(null, rootProject.projectDir)
        p.waitFor()
        if (p.exitValue() == 0) return p.text.trim().replaceFirst(/^v/, '')
    } catch (ignored) {}
    return '0.0.0'
}
def resolveVersionCode = { String name ->
    if (project.hasProperty('versionCode')) return project.property('versionCode').toString().toInteger()
    def m = (name =~ /(\d+)\.(\d+)\.(\d+)/)
    if (m.find()) return m.group(1).toInteger() * 10000 + m.group(2).toInteger() * 100 + m.group(3).toInteger()
    return 1
}
def appVersionName = resolveVersionName()
def appVersionCode = resolveVersionCode(appVersionName)

android {
    namespace = "com.owcramer.pokeemerald"
    compileSdk 35
    defaultConfig {
        applicationId "com.owcramer.pokeemerald"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode appVersionCode
        versionName appVersionName
        ndk {
            abiFilters 'x86_64', 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // libmain.so has text relocations (-z notext); keep it uncompressed and let
    // it load, and don't let the linter block the build over the prebuilt libs.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    lint {
        abortOnError = false
    }
}
