name: Build

on:
  push:
    branches: [native-arm64]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (.app, arm64)
    runs-on: macos-15   # Apple Silicon; the port is arm64-only
    steps:
      - uses: actions/checkout@v4

      # libpng is for the asset tools (gbagfx); sdl3 is the runtime the app
      # links and bundles. No GBA toolchain is needed -- the native build uses
      # clang throughout, including for the preprocessor.
      - name: Install dependencies
        run: brew install sdl3 libpng pkg-config

      - name: Build
        run: make native -j"$(sysctl -n hw.ncpu)"

      - name: Package .app
        run: ./tools/make_app.sh

      # ditto rather than a plain zip: it preserves the bundle's executable bit
      # and the ad-hoc signature, which a naive zip round-trip destroys.
      - name: Archive bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/pokeemerald.app pokeemerald-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-macos-arm64
          path: pokeemerald-macos-arm64.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pokeemerald-macos-arm64.zip

  # Linux (AppImage) and Windows (.exe) are not buildable from this tree yet.
  # The 64-bit path is Mach-O only -- tools/mach_o_symbols.py,
  # gen_macho_aliases.sh and -Wl,-alias_list have no ELF or PE equivalent here
  # -- and the sole alternative in the Makefile is a hardcoded 32-bit MinGW
  # cross-compile against SDL2 inherited from upstream, which predates the
  # 64-bit pointer work. Adding either means porting the build first, not
  # adding a job here.
