name: Build

on:
  # Only the main branch and release tags build on push. Feature branches build
  # through the pull_request trigger below, so an open PR does not run twice
  # (once for its push and once for the PR) on the same commit.
  push:
    branches: [native-arm64]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The release steps need to create a release and upload to it; the default
# token is read-only.
permissions:
  contents: write

jobs:
  macos:
    name: macOS (.app, arm64)
    runs-on: macos-15   # Apple Silicon; the port is arm64-only
    steps:
      - uses: actions/checkout@v4

      # libpng is for the asset tools (gbagfx); sdl3 is the runtime the app
      # links and bundles. No GBA toolchain is needed -- the native build uses
      # clang throughout, including for the preprocessor.
      - name: Install dependencies
        run: brew install sdl3 libpng pkg-config

      - name: Build
        run: make native -j"$(sysctl -n hw.ncpu)"

      - name: Package .app
        run: ./tools/make_app.sh

      # ditto rather than a plain zip: it preserves the bundle's executable bit
      # and the ad-hoc signature, which a naive zip round-trip destroys.
      - name: Archive bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/pokeemerald.app pokeemerald-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-macos-arm64
          path: pokeemerald-macos-arm64.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: pokeemerald-macos-arm64.zip

  # Unsigned .ipa for sideloading. CI has no Apple certificates and needs none:
  # whoever installs it signs it themselves with their own Apple ID (AltStore,
  # Sideloadly, TrollStore). A developer-signed build would be worse than
  # useless here -- it would only install on devices registered to that
  # developer's account.
  ios:
    name: iOS (.ipa, arm64, unsigned)
    # macos-26, not macos-15: the app icon is an Icon Composer .icon bundle,
    # which actool only understands from Xcode 26 on. The macos-15 image ships
    # Xcode 16.4, whose actool exits 0 without compiling it -- so the first
    # green run here produced an .ipa with no icon in it at all.
    runs-on: macos-26
    env:
      # Matches the SDL the port is developed against. 3.4 for its UIScene
      # support; the Linux job pins 3.2.x separately for its own reasons.
      SDL_TAG: release-3.4.14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libpng pkg-config cmake

      # The image's default Xcode is not guaranteed to be the newest installed,
      # and the icon needs 26+.
      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version | head -1

      # Homebrew's sdl3 is a macOS slice only, and the app links SDL statically,
      # so the iOS device slice has to be built here. Cached because it is by
      # far the slowest step and only changes when SDL_TAG does.
      - name: Cache SDL3 (iOS device slice)
        id: sdl
        uses: actions/cache@v4
        with:
          path: SDL/install-iosdev
          key: sdl3-iosdev-${{ env.SDL_TAG }}-macos-26

      - name: Build SDL3 for iOS
        if: steps.sdl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL SDL
          cmake -S SDL -B SDL/build-iosdev \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_STATIC=ON -DSDL_SHARED=OFF -DSDL_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/SDL/install-iosdev"
          cmake --build SDL/build-iosdev -j"$(sysctl -n hw.ncpu)"
          cmake --install SDL/build-iosdev

      # IOS_SDL defaults to a sibling ../SDL checkout; point it inside the
      # workspace so actions/cache can reach it.
      - name: Build
        run: |
          make ios IOS_SDK_NAME=iphoneos IOS_SDL="$PWD/SDL/install-iosdev" \
            -j"$(sysctl -n hw.ncpu)"

      - name: Package .ipa
        run: |
          ./tools/make_ios_app.sh unsigned
          ./tools/make_ipa.sh dist/pokeemerald.app dist/pokeemerald-ios.ipa

      # The bundle is assembled by hand, so nothing else would notice a missing
      # icon or a stripped executable bit -- the first run passed green while
      # shipping an .ipa with no icon.
      - name: Verify .ipa
        run: |
          unzip -l dist/pokeemerald-ios.ipa
          for f in Info.plist pokeemerald Assets.car; do
            unzip -l dist/pokeemerald-ios.ipa | grep -q "Payload/pokeemerald.app/$f" \
              || { echo "error: $f missing from .ipa"; exit 1; }
          done
          PERM=$(unzip -Z dist/pokeemerald-ios.ipa Payload/pokeemerald.app/pokeemerald | cut -c1-10)
          [ "$PERM" = "-rwxr-xr-x" ] \
            || { echo "error: executable bit not preserved (got $PERM)"; exit 1; }
          echo "ipa verified"

      - uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-ios
          path: dist/pokeemerald-ios.ipa
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pokeemerald-ios.ipa

  # AppImage + portable tarball, built natively on x86_64 and aarch64.
  #
  # Ubuntu 24.04 rather than 25.04: 25.04's libsdl3-dev hard-links the audio
  # backends (pipewire/pulse/sndio), so the AppImage would carry a client
  # library without its plugin modules and die at startup. We build SDL3 from
  # source instead, with every backend dlopen'd, so the bundle carries only
  # libSDL3 and loads whatever the host actually has -- degrading gracefully.
  # 24.04 also gives a glibc 2.39 floor (runs on SteamOS and every current
  # distro) and a wayland-protocols new enough for SDL3's Wayland backend.
  linux:
    name: Linux ${{ matrix.arch }} (AppImage + tarball)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      # appimagetool is itself an AppImage; 24.04 has no libfuse2, so make it
      # (and the tool's own runtime) self-extract instead of mounting via FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Install build and SDL3 dependencies
        run: |
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            git ca-certificates curl file binutils zsync desktop-file-utils \
            clang g++ make cmake ninja-build pkg-config libpng-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev \
            libgl-dev libegl-dev libgles-dev

      - uses: actions/checkout@v4

      # Backends and windowing systems are all *_SHARED (dlopen'd) so the AppImage
      # needs none of them at bundle time and picks them up from the host.
      - name: Build and install SDL3 from source
        run: |
          git clone --depth 1 --branch release-3.2.x https://github.com/libsdl-org/SDL
          cmake -S SDL -B SDL/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_PIPEWIRE_SHARED=ON -DSDL_PULSEAUDIO_SHARED=ON \
            -DSDL_ALSA_SHARED=ON -DSDL_SNDIO=OFF \
            -DSDL_WAYLAND=ON -DSDL_WAYLAND_SHARED=ON \
            -DSDL_X11=ON -DSDL_X11_SHARED=ON
          cmake --build SDL/build -j"$(nproc)"
          sudo cmake --install SDL/build --prefix /usr/local
          sudo ldconfig
          # Fail loudly if we accidentally linked a backend in (not dlopen'd).
          ! readelf -d /usr/local/lib/libSDL3.so.0 | grep -E 'pipewire|pulse|sndio'

      - name: Build
        run: PKG_CONFIG_PATH=/usr/local/lib/pkgconfig make native -j"$(nproc)"

      - name: Install appimagetool
        run: |
          curl -sSfL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Package AppImage
        run: ./tools/make_appimage.sh pokeemerald64 dist/pokeemerald-${{ matrix.arch }}.AppImage

      - name: Package tarball
        run: ./tools/make_tarball.sh pokeemerald64 dist/pokeemerald-linux-${{ matrix.arch }}.tar.gz ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-linux-${{ matrix.arch }}
          path: |
            dist/pokeemerald-${{ matrix.arch }}.AppImage
            dist/pokeemerald-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pokeemerald-${{ matrix.arch }}.AppImage
            dist/pokeemerald-linux-${{ matrix.arch }}.tar.gz

  # Native Arch package. Built in an Arch container so it links Arch's own SDL3
  # and declares a runtime dependency on the `sdl3` package rather than bundling
  # it. The game binary only needs glibc <= 2.34, so this still runs on the
  # older glibc that SteamOS (also pacman-based) ships.
  arch-pacman:
    name: Arch package (.pkg.tar.zst, x86_64)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm --needed \
            base-devel clang llvm make pkgconf sdl3 libpng python git sudo

      - uses: actions/checkout@v4

      - name: Build
        run: make native -j"$(nproc)"

      # makepkg refuses to run as root; build under a throwaway unprivileged
      # user with passwordless sudo.
      - name: Package pacman
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder:builder .
          PKGVER="${GITHUB_REF_NAME#v}"
          [ "$PKGVER" = "$GITHUB_REF_NAME" ] && PKGVER=1.0.0   # untagged build
          sudo -u builder env PKGVER="$PKGVER" ./tools/make_pacman.sh pokeemerald64 dist

      - uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-arch-x86_64
          path: dist/pokeemerald-*.pkg.tar.zst
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pokeemerald-*.pkg.tar.zst

  # Universal debug-installable APK carrying both ABIs (arm64-v8a for devices,
  # x86_64 for emulators). libmain.so and libSDL3.so are cross-compiled with the
  # NDK by `make android`, staged into jniLibs, and packaged by Gradle.
  android:
    name: Android (.apk, arm64-v8a + x86_64)
    runs-on: ubuntu-24.04
    env:
      # Must match the org.libsdl.app Java glue checked into android/ (SDL 3.2.x).
      SDL_TAG: release-3.2.x
      # r27+ so the .so's are 16 KB-page aligned, which Android 15+ devices (and
      # the 16k emulator images) require. Pinned for reproducible builds.
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # clang/make/python3/libpng build the asset tools and the game exactly as
      # the other native jobs; cmake+ninja build SDL3 for Android.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            clang make python3 libpng-dev pkg-config cmake ninja-build

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # SDL3 for Android is the slowest step and only changes with SDL_TAG/NDK.
      - name: Cache SDL3 for Android
        id: sdl
        uses: actions/cache@v4
        with:
          path: |
            build-android/SDL/include
            build-android/SDL/b-arm64-v8a
            build-android/SDL/b-x86_64
          key: sdl3-android-${{ env.SDL_TAG }}-ndk${{ env.NDK_VERSION }}

      - name: Build SDL3 for Android (both ABIs)
        if: steps.sdl.outputs.cache-hit != 'true'
        run: |
          rm -rf build-android/SDL
          git clone --depth 1 --branch "$SDL_TAG" \
            https://github.com/libsdl-org/SDL build-android/SDL
          for abi in arm64-v8a x86_64; do
            cmake -S build-android/SDL -B "build-android/SDL/build-$abi" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-21 \
              -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF
            cmake --build "build-android/SDL/build-$abi" -j"$(nproc)"
            mkdir -p "build-android/SDL/b-$abi"
            cp "build-android/SDL/build-$abi/libSDL3.so" "build-android/SDL/b-$abi/"
          done

      - name: Build native libraries (both ABIs)
        run: |
          for abi in arm64-v8a x86_64; do
            make android ANDROID_ABI="$abi" ANDROID_NDK="$ANDROID_NDK" -j"$(nproc)"
          done

      - name: Build APK
        run: |
          # Tag builds (refs/tags/vX.Y.Z) carry the release version; anything
          # else is an untagged CI build and stays at 0.0.0 so it can't be
          # mistaken for a release.
          VERSION_NAME="0.0.0"
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION_NAME="${GITHUB_REF_NAME#v}" ;;
          esac
          cd android && ./gradlew assembleRelease --console=plain \
            -PversionName="$VERSION_NAME"

      # Sign with the release keystore held in repo secrets, so every build shares
      # one signature and releases update in place (and keep their save). Pull
      # requests from forks receive no secrets, so fall back to an ephemeral key
      # there -- that APK still installs, it just cannot update an existing one.
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > release.keystore
          else
            echo "::warning::No signing secret (fork PR); using an ephemeral key -- install-only, no in-place updates."
            keytool -genkeypair -v -keystore release.keystore -storepass android \
              -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Pokemon Emerald"
            KS_PASS=android; KEY_ALIAS=ci; KEY_PASS=android
          fi
          "${BT}zipalign" -f 4 "$UNSIGNED" aligned.apk
          "${BT}apksigner" sign --ks release.keystore --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" aligned.apk
          "${BT}apksigner" verify --print-certs aligned.apk | head -1
          rm -f release.keystore
          mkdir -p dist && mv aligned.apk dist/pokeemerald-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-android
          path: dist/pokeemerald-android.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pokeemerald-android.apk

  # Windows is still not buildable from this tree: the only path in the
  # Makefile is a hardcoded 32-bit MinGW cross-compile against SDL2 inherited
  # from upstream, predating the 64-bit pointer work.
